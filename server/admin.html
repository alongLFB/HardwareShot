<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理中心 · HardwareShot 云端天梯榜</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --card-hover: #19233c;
      --border: #243252;
      --text: #f1f5f9;
      --sub: #94a3b8;
      --cyan: #00f0ff;
      --blue: #3b82f6;
      --orange: #f97316;
      --green: #10b981;
      --red: #ef4444;
      --gold: #fde047;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scrollbar-gutter: stable; }
    body {
      background: radial-gradient(circle at 50% 0%, #162447 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Microsoft YaHei UI", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      padding: 24px 16px 60px;
    }
    .container { max-width: 1360px; margin: 0 auto; }

    /* Top Bar */
    .admin-header {
      background: linear-gradient(135deg, rgba(10,86,216,0.3) 0%, rgba(239,68,68,0.2) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .header-title-box h1 {
      font-size: 24px;
      font-weight: 900;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title-box p { font-size: 13px; color: var(--sub); margin-top: 3px; }

    /* Auth Box */
    .auth-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .auth-box input {
      background: #0b1120;
      border: 1px solid var(--border);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      width: 160px;
      outline: none;
    }
    .auth-box input:focus { border-color: var(--cyan); }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--red);
      display: inline-block;
    }
    .status-dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
      transition: all 0.16s;
      color: white;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #0a56d8; border-color: #38bdf8; }
    .btn-primary:hover { background: #2563eb; }
    .btn-green { background: #059669; border-color: #34d399; }
    .btn-green:hover { background: #10b981; }
    .btn-red { background: #b91c1c; border-color: #f87171; }
    .btn-red:hover { background: #dc2626; }
    .btn-ghost { background: rgba(255,255,255,0.06); border-color: var(--border); color: var(--text); }
    .btn-ghost:hover { background: rgba(255,255,255,0.12); border-color: var(--cyan); }
    .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }

    /* Stats Overview */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 820px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .stat-label { font-size: 11.5px; color: var(--sub); }
    .stat-val { font-size: 20px; font-weight: 900; color: white; margin-top: 2px; }

    /* Toolbar */
    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* Table */
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow-x: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    th {
      background: #17223b;
      color: #cbd5e1;
      padding: 12px 14px;
      font-weight: 800;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #e2e8f0;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .td-nick { font-weight: 800; color: white; display: flex; align-items: center; gap: 6px; }
    .tier-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .tier-T0 { background: #7c2d12; color: #fdba74; }
    .tier-T1 { background: #1e1b4b; color: #c7d2fe; }
    .tier-T2 { background: #064e3b; color: #a7f3d0; }
    .tier-T3 { background: #172554; color: #bae6fd; }
    .tier-T4 { background: #27272a; color: #e4e4e7; }
    .fun-badge {
      font-size: 10.5px;
      background: rgba(236,72,153,0.18);
      color: #f472b6;
      border: 1px solid rgba(236,72,153,0.4);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .td-actions { display: flex; gap: 6px; align-items: center; }

    /* Toast */
    #toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      border: 1px solid var(--cyan);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 9999;
      display: none;
    }
  </style>
</head>
<body>
  <div id="toast"></div>

  <div class="container">
    <!-- Header -->
    <div class="admin-header">
      <div class="header-title-box">
        <h1>🛠️ HardwareShot 云端后台管理中心</h1>
        <p>主机配置审核 · 测试机型删除 · 数据备份与全服天梯维护</p>
      </div>

      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <div class="auth-box">
          <span class="status-dot" id="authDot" title="认证状态"></span>
          <span style="font-size:12px;color:var(--sub);">管理密钥:</span>
          <input type="password" id="adminKeyInput" placeholder="输入管理密钥..." onkeydown="if(event.key==='Enter') saveAndVerifyKey()" />
          <button class="btn btn-primary btn-sm" onclick="saveAndVerifyKey()">验证解锁</button>
          <button class="btn btn-ghost btn-sm" id="btnChangeKey" onclick="changeAdminKeyPrompt()" style="display:none;">修改密钥</button>
          <button class="btn btn-ghost btn-sm" id="btnLogout" onclick="logoutAdmin()" style="display:none;">锁定退出</button>
        </div>
        <a class="btn btn-ghost" href="/">🌐 返回前台网站</a>
      </div>
    </div>

    <!-- Stats Overview -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">收录电脑总数</div>
        <div class="stat-val" id="stCount">0 台</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">数据库大小</div>
        <div class="stat-val" id="stSize">0 KB</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">当前全服最高分</div>
        <div class="stat-val" id="stTopScore" style="color:var(--cyan);">- 分</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">全服身价最高</div>
        <div class="stat-val" id="stTopUsed" style="color:var(--orange);">-</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <input type="checkbox" id="checkAll" onchange="toggleCheckAll(this.checked)" style="cursor:pointer;" />
        <label for="checkAll" style="font-size:13px;font-weight:bold;cursor:pointer;">全选</label>
        <button class="btn btn-red btn-sm" id="btnBatchDel" onclick="deleteSelected()" disabled>🗑️ 批量删除选中 (<span id="selCount">0</span>)</button>
        <button class="btn btn-ghost btn-sm" onclick="loadAdminData()">🔄 刷新列表</button>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-green btn-sm" onclick="exportDataBackup()">💾 导出数据备份 (.json)</button>
        <button class="btn btn-red btn-sm" onclick="clearAllDataPrompt()">⚠️ 清空全服数据 (慎用)</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th style="width:40px;"></th>
            <th style="width:75px;">短 ID</th>
            <th style="width:160px;">玩家昵称 / 人设</th>
            <th style="width:130px;">电脑型号</th>
            <th>核心硬件 (CPU / 显卡 / 内存)</th>
            <th style="width:110px;">战力得分</th>
            <th style="width:130px;">估值 (二手/全新)</th>
            <th style="width:140px;">扫描时间</th>
            <th style="width:120px;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="9" style="text-align:center;padding:40px;color:var(--sub);">正在验证权限并加载数据…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let configsList = [];
    let selectedIds = new Set();

    function getSavedKey() {
      return (localStorage.getItem('hw_admin_key') || '').trim();
    }

    function setSavedKey(k) {
      if (k) {
        localStorage.setItem('hw_admin_key', k);
      } else {
        localStorage.removeItem('hw_admin_key');
      }
    }

    function logoutAdmin() {
      setSavedKey('');
      document.getElementById('adminKeyInput').value = '';
      document.getElementById('authDot').classList.remove('active');
      document.getElementById('btnChangeKey').style.display = 'none';
      document.getElementById('btnLogout').style.display = 'none';
      configsList = [];
      document.getElementById('stCount').innerText = '0 台';
      document.getElementById('stSize').innerText = '0 KB';
      document.getElementById('stTopScore').innerText = '- 分';
      document.getElementById('stTopUsed').innerText = '-';
      document.getElementById('tableBody').innerHTML = `
        <tr>
          <td colspan="9" style="text-align:center;padding:50px;color:var(--sub);">
            🔒 管理后台已锁定。请输入管理密钥并点击「验证解锁」以加载数据。
          </td>
        </tr>
      `;
      showToast('已锁定后台并清除本地凭证');
    }

    async function verifyKey(key) {
      if (!key) return false;
      try {
        const res = await fetch('/api/admin/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: key })
        });
        const data = await res.json();
        return data.ok === true;
      } catch (e) {
        return false;
      }
    }

    async function saveAndVerifyKey() {
      const k = document.getElementById('adminKeyInput').value.trim();
      if (!k) {
        showToast('请输入管理密钥');
        return;
      }
      showToast('正在验证密钥…');
      const ok = await verifyKey(k);
      if (ok) {
        setSavedKey(k);
        document.getElementById('authDot').classList.add('active');
        document.getElementById('btnChangeKey').style.display = 'inline-flex';
        document.getElementById('btnLogout').style.display = 'inline-flex';
        showToast('✔ 认证成功，已进入管理中心！');
        loadAdminData();
      } else {
        document.getElementById('authDot').classList.remove('active');
        document.getElementById('btnChangeKey').style.display = 'none';
        document.getElementById('btnLogout').style.display = 'none';
        showToast('✕ 密钥错误，拒绝访问！');
      }
    }

    async function changeAdminKeyPrompt() {
      const key = getSavedKey();
      if (!key) {
        showToast('请先登录解锁管理权限');
        return;
      }
      const newKey = prompt('请输入新的管理密钥 (至少 6 位字符):');
      if (!newKey || !newKey.trim()) return;
      if (newKey.trim().length < 6) {
        alert('为了安全，新密钥长度不能少于 6 位字符！');
        return;
      }

      try {
        const res = await fetch('/api/admin/change-key', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': key
          },
          body: JSON.stringify({ new_key: newKey.trim() })
        });
        const data = await res.json();
        if (data.ok) {
          setSavedKey(newKey.trim());
          document.getElementById('adminKeyInput').value = newKey.trim();
          showToast('✔ 管理密钥已修改成功，请牢记新密钥！');
        } else {
          showToast('修改失败: ' + (data.error || '未知错误'));
        }
      } catch (err) {
        showToast('请求出错: ' + err.message);
      }
    }

    async function loadAdminData() {
      const key = getSavedKey();
      if (!key) {
        logoutAdmin();
        return;
      }
      try {
        const res = await fetch('/api/admin/configs', {
          headers: { 'X-Admin-Key': key }
        });
        if (res.status === 403) {
          logoutAdmin();
          showToast('密钥失效或错误，请重新输入');
          return;
        }
        const data = await res.json();
        if (data.ok) {
          document.getElementById('authDot').classList.add('active');
          document.getElementById('btnChangeKey').style.display = 'inline-flex';
          document.getElementById('btnLogout').style.display = 'inline-flex';
          configsList = data.items || [];
          document.getElementById('stCount').innerText = configsList.length + ' 台';
          document.getElementById('stSize').innerText = Math.round((data.db_size || 0) / 1024) + ' KB';

          if (configsList.length > 0) {
            const topScore = Math.max(...configsList.map(c => c.total_score || 0));
            const topUsed = Math.max(...configsList.map(c => c.total_used || 0));
            document.getElementById('stTopScore').innerText = topScore.toLocaleString() + ' 分';
            document.getElementById('stTopUsed').innerText = '¥' + topUsed.toLocaleString();
          }

          renderTable();
        }
      } catch (err) {
        showToast('拉取管理数据失败: ' + err.message);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      selectedIds.clear();
      updateCheckState();

      if (!configsList.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9" style="text-align:center;padding:40px;color:var(--sub);">
              当前数据库为空，暂无上传的主机配置。
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = configsList.map((c, idx) => {
        return `
          <tr id="tr-${c.id}">
            <td>
              <input type="checkbox" class="row-check" data-id="${c.id}" onchange="toggleRowCheck('${c.id}', this.checked)" style="cursor:pointer;" />
            </td>
            <td><code style="color:var(--cyan);font-weight:bold;">${c.id}</code></td>
            <td>
              <div class="td-nick">
                <span>${escapeHtml(c.nickname)}</span>
                <span class="tier-badge tier-${c.overall_tier||'T2'}">${c.overall_tier||'T2'}</span>
              </div>
              ${c.fun_tag ? `<div style="margin-top:2px;"><span class="fun-badge">${escapeHtml(c.fun_tag)}</span></div>` : ''}
            </td>
            <td>${escapeHtml(c.model || '台式')}</td>
            <td>
              <div style="font-size:12px;color:#cbd5e1;">⚡ ${escapeHtml(c.cpu_name || '-')}</div>
              <div style="font-size:12px;color:#cbd5e1;">🎮 ${escapeHtml(c.gpu_name || '-')}</div>
              <div style="font-size:11.5px;color:var(--sub);">🧠 ${escapeHtml(c.ram_desc || '-')}</div>
            </td>
            <td style="font-weight:900;color:var(--cyan);">${(c.total_score||0).toLocaleString()}</td>
            <td>
              <div style="color:var(--orange);font-weight:bold;">二手 ¥${(c.total_used||0).toLocaleString()}</div>
              <div style="color:var(--green);font-size:11.5px;">全新 ¥${(c.total_new||0).toLocaleString()}</div>
            </td>
            <td style="font-size:12px;color:var(--sub);">${escapeHtml(c.scan_time || c.updated_at || '')}</td>
            <td>
              <div class="td-actions">
                <a class="btn btn-ghost btn-sm" href="/?id=${c.id}" target="_blank" title="在新标签页查看前台配置详情">👁️</a>
                <button class="btn btn-red btn-sm" onclick="deleteOne('${c.id}', '${escapeHtml(c.nickname)}')">🗑️ 删除</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function toggleRowCheck(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      updateCheckState();
    }

    function toggleCheckAll(checked) {
      const checks = document.querySelectorAll('.row-check');
      checks.forEach(cb => {
        cb.checked = checked;
        const cid = cb.getAttribute('data-id');
        if (checked) selectedIds.add(cid);
        else selectedIds.delete(cid);
      });
      updateCheckState();
    }

    function updateCheckState() {
      const count = selectedIds.size;
      document.getElementById('selCount').innerText = count;
      document.getElementById('btnBatchDel').disabled = (count === 0);
      const checkAll = document.getElementById('checkAll');
      if (configsList.length > 0 && count === configsList.length) {
        checkAll.checked = true;
      } else {
        checkAll.checked = false;
      }
    }

    async function deleteOne(id, nickname) {
      if (!confirm(`确定要永久删除「${nickname}」(ID: ${id}) 的配置记录吗？\n删除后不可恢复！`)) {
        return;
      }
      await doDelete([id]);
    }

    async function deleteSelected() {
      const ids = Array.from(selectedIds);
      if (!ids.length) return;
      if (!confirm(`确定要批量永久删除选中的 ${ids.length} 台电脑配置吗？\n删除后不可恢复！`)) {
        return;
      }
      await doDelete(ids);
    }

    async function doDelete(ids) {
      const key = getSavedKey();
      showToast('正在删除记录…');
      try {
        const res = await fetch('/api/admin/delete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': key
          },
          body: JSON.stringify({ ids: ids })
        });
        const data = await res.json();
        if (data.ok) {
          showToast(`✔ 成功删除 ${data.deleted} 条配置！`);
          loadAdminData();
        } else {
          showToast('删除失败: ' + (data.error || '未知错误'));
        }
      } catch (err) {
        showToast('请求出错: ' + err.message);
      }
    }

    async function clearAllDataPrompt() {
      const key = getSavedKey();
      const code = prompt('警告：清空后全服所有配置都将被抹除！\n请输入“确认清空”以执行操作:');
      if (code !== '确认清空') {
        if (code !== null) showToast('输入不匹配，已取消');
        return;
      }

      try {
        const res = await fetch('/api/admin/clear-all', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': key
          }
        });
        const data = await res.json();
        if (data.ok) {
          showToast(`✔ ${data.msg}`);
          loadAdminData();
        } else {
          showToast('清空失败: ' + (data.error || '未知错误'));
        }
      } catch (err) {
        showToast('请求出错: ' + err.message);
      }
    }

    async function exportDataBackup() {
      const key = getSavedKey();
      try {
        const res = await fetch('/api/admin/export', {
          headers: { 'X-Admin-Key': key }
        });
        const data = await res.json();
        if (data.ok) {
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `HardwareShot_全服配置备份_${new Date().toISOString().slice(0,10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('✔ 备份数据导出成功！');
        } else {
          showToast('导出失败: ' + (data.error || '未授权'));
        }
      } catch (err) {
        showToast('导出请求出错: ' + err.message);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Auto initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
      const k = getSavedKey();
      document.getElementById('adminKeyInput').value = k;
      if (k) {
        loadAdminData();
      } else {
